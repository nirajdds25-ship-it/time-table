<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BollyGold UI</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Oswald', sans-serif;
    }

    body{
      background:#eaeaea;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .container{
      width:1100px;
      min-height:700px;
      background:linear-gradient(135deg,#18c7e5,#6f8fd8);
      padding:40px 50px;
      position:relative;
      overflow:hidden;
    }

    /* Navbar */
    .navbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .logo{
      font-size:42px;
      font-weight:700;
      color:#fff;
      letter-spacing:1px;
    }

    .logo span{
      color:#ffc400;
    }

    .menu-btn{
      border:1px solid rgba(255,255,255,0.5);
      padding:10px 18px;
      color:#fff;
      background:transparent;
      border-radius:4px;
      cursor:pointer;
      font-size:16px;
    }

    /* Main Section */
    .main{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:80px;
      gap:50px;
      flex-wrap:wrap;
    }

    /* Left Content */
    .left{
      flex:1;
      min-width:320px;
    }

    .breadcrumb{
      color:#dceeff;
      margin-bottom:40px;
      font-size:18px;
      font-weight:300;
    }

    .breadcrumb span{
      color:#ffffff;
      text-decoration:underline;
    }

    .left h1{
      font-size:85px;
      line-height:1.1;
      color:#fff;
      margin-bottom:25px;
      font-weight:700;
    }

    .left p{
      color:#e7f7ff;
      font-size:24px;
      line-height:1.8;
      max-width:520px;
      margin-bottom:40px;
      font-weight:300;
    }

    .membership-btn{
      background:#fff;
      color:#ff4f87;
      border:none;
      padding:18px 34px;
      border-radius:40px;
      font-size:20px;
      cursor:pointer;
      font-weight:500;
      box-shadow:0 5px 15px rgba(0,0,0,0.15);
    }

    /* Contact Card */
    .contact-card{
      width:420px;
      background:rgba(255,255,255,0.12);
      backdrop-filter:blur(10px);
      padding:35px;
      border-radius:20px;
      box-shadow:0 15px 30px rgba(0,0,0,0.25);
    }

    .contact-card h2{
      color:#fff;
      font-size:42px;
      margin-bottom:30px;
      font-weight:500;
    }

    .input-box{
      width:100%;
      margin-bottom:22px;
    }

    .input-box input{
      width:100%;
      padding:18px;
      border:none;
      outline:none;
      border-radius:10px;
      background:rgba(255,255,255,0.2);
      color:#fff;
      font-size:18px;
    }

    .input-box input::placeholder{
      color:#e8f5ff;
    }

    .submit-btn{
      width:100%;
      padding:18px;
      border:none;
      background:#ffc400;
      color:#111;
      border-radius:8px;
      font-size:22px;
      cursor:pointer;
      font-weight:600;
      transition:0.3s;
    }

    .submit-btn:hover{
      background:#ffb300;
    }

    /* Responsive */
    @media(max-width:900px){

      .container{
        padding:30px;
      }

      .main{
        flex-direction:column;
        align-items:flex-start;
      }

      .left h1{
        font-size:60px;
      }

      .contact-card{
        width:100%;
      }
    }

    @media(max-width:600px){

      .left h1{
        font-size:45px;
      }

      .left p{
        font-size:18px;
      }

      .logo{
        font-size:30px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Navbar -->
    <div class="navbar">
      <div class="logo">
        BOLLY<span>GOLD</span>
      </div>

      <button class="menu-btn">
        Movies ▼
      </button>
    </div>

    <!-- Main Section -->
    <div class="main">

      <!-- Left Side -->
      <div class="left">

        <div class="breadcrumb">
          <span>Home</span> / Premium Access
        </div>

        <h1>
          Watch Your <br>
          Favorites.
        </h1>

        <p>
          Sultan, Prem Ratan Dhan Payo aur bhi bahut kuch.
          Abhi join karein premium membership ke liye.
        </p>

        <button class="membership-btn">
          Get Membership
        </button>

      </div>

      <!-- Contact Form -->
      <div class="contact-card">

        <h2>Contact Us</h2>

        <div class="input-box">
          <input type="text" placeholder="Full Name">
        </div>

        <div class="input-box">
          <input type="email" placeholder="Email Address">
        </div>

        <button class="submit-btn">
          Send Request
        </button>

      </div>

    </div>

  </div>

</body>
</html>
